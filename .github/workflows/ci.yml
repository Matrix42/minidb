name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全部测试 + 集成测试 (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `test` 阶段覆盖全部模块的单元测试、minidb-integration-tests 的集成测试
      # 以及 minidb-tpcds 的 TPC-DS/DuckDB 正确性测试(--add-opens 已配置在根 pom 的 surefire argLine 中)。
      - name: 运行全部测试与集成测试
        run: ./mvnw -B -ntp test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
